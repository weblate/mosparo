monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: main_grouped
                excluded_http_codes: [ 404, 405 ]
                channels: ["!deprecation"]
                buffer_size: 50
            main_grouped:
                type: group
                members: [ main_file, main_stream ]
            main_file:
                type: rotating_file
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                max_files: 10
            main_stream:
                type: stream
                path: php://stderr
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
